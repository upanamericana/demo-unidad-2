<style>
  /* =========================================================
     PORTADA · Posgrados Panamericana (la Propuesta 5 de
     docs/propuestas-portada-2026-10-07, elegida el 2026-10-10, con el Tahalí de la 6 y el ritmo
     vertical en vh desde la ronda del 2026-10-15)
     Master graphic B del manual (pp. 224 y 228), con el gesto de la portada de Andina: la
     fotografía ocupa la mitad derecha a toda altura y se funde hacia el texto; el Tahalí
     entra sobre la foto en verde con multiply (la variante «con foto» de Posgrados,
     p. 232), lejos del rostro (p. 224); la textura tipográfica del wordmark,
     tono sobre tono, detrás del texto (pp. 130, 220). La foto va tal cual: sin filtro de
     color (p. 28); solo la máscara que la funde y una sombra neutra en la base.
     Foto: Vitaly Gariev, Unsplash (Unsplash License), unsplash.com/photos/Z6ogoeso9BI.
     Cabeza en Laurentian Semibold EN ALTAS (p. 213); destacado en bajas (p. 214).
     El CSS de portada viaja por curso (igual que en Scala y Andina).
     ========================================================= */
  .up-portada{
    position:relative; overflow:hidden; isolation:isolate;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center;
    background: linear-gradient(118deg, #062A25 0%, #0A4039 55%, #0B4740 100%);
    color:#fff;
  }
  /* la textura tipográfica detrás del texto: una por composición */
  .up-portada__textura{
    position:absolute; z-index:0; pointer-events:none;
    left:-12%; top:-22%; width:min(70vw, 900px); aspect-ratio:1;
    background:#F7F4EE;
    -webkit-mask:var(--up-textura) center / contain no-repeat;
            mask:var(--up-textura) center / contain no-repeat;
    opacity:.04;
  }
  /* la foto: mitad derecha a toda altura, fundida hacia el texto (el gesto de Andina).
     El fundido es corto para que la mano que anota (el acto de verificar) quede a la vista. */
  .up-portada__foto{
    position:absolute; z-index:1; top:0; right:0; bottom:0;
    width:min(62vw, 980px);
    background:url('assets/img/curso/portada-persona.webp') 74% 30% / cover no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.55) 12%, #000 28%);
            mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.55) 12%, #000 28%);
  }
  /* sombra neutra en la base para asentar la foto; no tiñe (p. 28: sin filtros) */
  .up-portada__foto::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 62%, rgba(4,30,26,.55) 100%);
  }
  /* un solo Tahalí (C, ronda 2026-10-15: el de la Propuesta 6): verde sólido (p. 232, primera
     columna de Posgrados), entrando por la esquina superior derecha y cortado por el formato,
     como en el afiche de la p. 228; cruza el hombro, nunca el rostro (p. 224), y queda lejos
     del texto: un título largo nunca le cae encima */
  .up-portada__tahali{
    position:absolute; z-index:2; top:0; bottom:0;
    right:calc(min(62vw, 980px) * -.24);
    width:calc(min(62vw, 980px) * .48);
    background:var(--up-tahali-verde) center / 100% 100% no-repeat;
    pointer-events:none;
  }

  .up-portada__inner{
    position:relative; z-index:3;
    width:100%; max-width:1240px; margin:0 auto;
    /* A (ronda 2026-10-15): el ritmo vertical escala con la altura de la ventana para que
       la portada quepa en la primera pantalla sin scroll (botón a la vista a 1366×650 y 1280×600) */
    padding:clamp(20px, 4.5vh, 88px) clamp(32px, 6vw, 88px);
  }
  .up-portada__texto{ max-width:560px; }
  .up-portada__logo img{ height:116px; width:auto; display:block; margin-bottom:clamp(14px, 3.5vh, 56px); }
  .up-portada__eyebrow{
    display:inline-flex; align-items:center; gap:12px;
    font-family:var(--font-body); font-weight:600; font-size:.8rem;
    letter-spacing:.24em; text-transform:uppercase;
    color:var(--c-dorado-claro); margin-bottom:clamp(10px, 2.4vh, 22px);
  }
  .up-portada__eyebrow::before{
    content:''; width:16px; height:10px;
    background:var(--up-eyebrow) left center / contain no-repeat;
  }
  .up-portada__title{
    margin:0 0 clamp(10px, 2.4vh, 22px); color:#fff;
    font-family:var(--font-display); font-weight:600;
    font-size:min(clamp(2.4rem, 5vw, 3.9rem), 8.6vh); line-height:.92; letter-spacing:.01em;
    text-transform:uppercase;
    -webkit-hyphens:auto; hyphens:auto; hyphenate-limit-chars:8 4 4;
    text-shadow:0 2px 24px rgba(4,30,26,.5);
  }
  .up-portada__title .up-suave{ color:rgba(255,255,255,.74); font-weight:400; }
  .up-portada__title .up-destacado{
    display:block; margin-top:.28em;
    text-transform:none; font-weight:700; letter-spacing:-.015em;
    font-size:.78em; line-height:1.02;
    color:var(--c-dorado-claro);
  }
  .up-portada__title--largo{ font-size:min(clamp(2rem, 4.1vw, 3.2rem), 7.4vh); }
  .up-portada__sub{
    margin:0 0 clamp(12px, 3vh, 28px); padding-top:clamp(8px, 1.8vh, 16px);
    border-top:1px solid rgba(255,255,255,.28);
    max-width:440px;
    color:rgba(255,255,255,.86);
    font-size:clamp(1rem, 1.5vw, 1.15rem); font-weight:300; letter-spacing:.02em;
  }
  .up-portada__quote{
    color:#fff; font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:min(clamp(1.12rem, 1.8vw, 1.36rem), 2.7vh); line-height:1.48;
    max-width:500px; margin:0 0 clamp(16px, 4vh, 38px);
    padding-left:20px; border-left:3px solid var(--c-dorado);
  }
  .up-portada__acciones{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .up-portada__cta{
    display:inline-flex; align-items:center; gap:10px;
    background:#fff; color:var(--c-acento); text-decoration:none;
    font-family:var(--font-body); font-weight:600; font-size:1rem; letter-spacing:.02em;
    padding:clamp(12px, 1.8vh, 16px) 30px; border-radius:var(--r-md);
    box-shadow:0 14px 34px rgba(4,30,26,.40);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  }
  .up-portada__cta:hover,
  .up-portada__cta:focus-visible{ background:var(--c-dorado-claro); color:var(--c-deep); transform:translateY(-2px); }
  .up-portada__descarga{
    display:inline-grid; place-items:center;
    width:52px; height:52px; border-radius:var(--r-md);
    color:#fff; text-decoration:none;
    border:1.5px solid rgba(255,255,255,.5);
    transition:border-color .2s ease;
  }
  .up-portada__descarga svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
  .up-portada__descarga .up-flecha{ transition:transform .28s cubic-bezier(.34,1.4,.64,1); }
  .up-portada__descarga:hover, .up-portada__descarga:focus-visible{ border-color:#fff; color:#fff; }
  .up-portada__descarga:hover .up-flecha, .up-portada__descarga:focus-visible .up-flecha{ transform:translateY(3.5px); }

  @media (prefers-reduced-motion: reduce){
    .up-portada__descarga .up-flecha{ transition:none; }
    .up-portada__cta{ transition:none; }
  }
  /* Móvil: la foto pasa arriba, a franja, fundida hacia abajo; el texto debajo */
  @media (max-width: 900px){
    .up-portada{ flex-direction:column; align-items:stretch; }
    .up-portada__foto{
      position:relative; width:100%; height:min(72vw, 380px);
      background-position:78% 30%;
      -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
              mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
    }
    .up-portada__foto::after{ display:none; }
    .up-portada__tahali{ left:auto; right:-24%; width:48%; top:0; bottom:auto; height:min(72vw, 380px); }
    .up-portada__textura{ top:30%; left:-40%; width:140%; }
    .up-portada__inner{ padding-top:8px; }
    .up-portada__logo img{ height:84px; margin-bottom:24px; }
    .up-portada__quote{ font-size:1.05rem; max-width:none; }
    .up-portada__texto{ max-width:none; }
  }
</style>

<section class="up-portada">
  <span class="up-portada__textura" aria-hidden="true"></span>
  <div class="up-portada__foto" role="img" aria-label="Un profesional de barba canosa y gafas revisa y anota un documento en su escritorio, con luz natural."></div>
  <span class="up-portada__tahali" aria-hidden="true"></span>

  <div class="up-portada__inner">
    <div class="up-portada__texto">
      <div class="up-portada__logo">
        <img src="assets/img/logos/up-logo-blanco.svg" alt="Posgrados Panamericana · En línea" />
      </div>

      <div class="up-portada__eyebrow">Semana 2</div>

      <h1 class="up-portada__title up-portada__title--largo" lang="es">
        De la respuesta <span class="up-suave">a la</span> recomendación:
        <span class="up-destacado">audita antes de confiar</span>
      </h1>

      <p class="up-portada__sub">Toma de decisiones con datos&nbsp;+&nbsp;IA</p>

      <!-- Idea clave de la introducción, literal -->
      <p class="up-portada__quote">
        Auditar no es desconfiar de todo lo que la IA produce; es verificar antes de
        actuar.
      </p>

      <div class="up-portada__acciones">
        <a class="up-portada__cta" href="temario.html">
          Ver el contenido
          <iconify-icon icon="mdi:arrow-right"></iconify-icon>
        </a>
        <a class="up-portada__descarga" href="{{PDF}}" download title="Descargar el cuaderno de aprendizaje (PDF)" aria-label="Descargar el cuaderno de aprendizaje en PDF" data-ova-pdf-btn><svg viewBox="0 0 24 24" aria-hidden="true"><g class="up-flecha"><path d="M12 2.5V11.5"/><path d="M8.5 8L12 11.5L15.5 8"/></g><path d="M5 16v2.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V16"/></svg></a>
      </div>
    </div>
  </div>
</section>
